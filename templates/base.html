<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#09090c"/>
  <title>{% block title %}Praveen's Financial Tools{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="/static/app.js" defer></script>
  {% block head_extra %}{% endblock %}
</head>
<body>

<nav class="navbar">
  <a class="nav-brand" href="/">
    <span class="nav-logo">Praveen<span>.</span></span>
    <span class="nav-divider"></span>
    <span class="nav-tagline">Financial Tools</span>
  </a>

  <!-- Mobile hamburger -->
  <button class="nav-toggle" id="nav-toggle" aria-label="Menu" onclick="toggleNav()">
    <span></span><span></span><span></span>
  </button>

  <div class="nav-links" id="nav-links">
    <a class="nav-link {% if active == 'home' %}active{% endif %}"        href="/">Home</a>
    <a class="nav-link {% if active == 'apex' %}active{% endif %}"        href="/apex">APEX</a>
    <a class="nav-link {% if active == 'recommender' %}active{% endif %}" href="/recommender">Recommender</a>
    <a class="nav-link {% if active == 'about' %}active{% endif %}"       href="/about">Methodology</a>
  </div>
</nav>

{% block content %}{% endblock %}

<footer class="footer">
  <span>Praveen's Financial Tools</span>
  <span>
    <a href="https://fred.stlouisfed.org/" target="_blank">FRED</a> ·
    <a href="https://www.multpl.com/shiller-pe" target="_blank">Shiller CAPE</a> ·
    <a href="https://finance.yahoo.com" target="_blank">Yahoo Finance</a>
  </span>
  <span>Not financial advice</span>
</footer>

<script>
function toggleNav() {
  document.getElementById('nav-links').classList.toggle('open');
}
// Close nav when a link is tapped on mobile
document.querySelectorAll('.nav-link').forEach(l => {
  l.addEventListener('click', () => {
    document.getElementById('nav-links').classList.remove('open');
  });
});
</script>
</body>
</html>
